# Trivy secret-scanning settings, used by CI and `make scan-image`.
#
# Trivy's "gcp-service-account" rule looks for the text "type": "service_account".
# The Anthropic SDK has that text in several docstrings (they describe a field,
# they are not keys), so the image scan failed on them. Only the installed
# Anthropic package is skipped; every other file in the images is still checked
# for secrets, and gitleaks still checks our own code.
allow-rules:
  - id: anthropic-sdk-docstrings
    description: Docstrings in the installed Anthropic SDK, not real keys
    path: .*/site-packages/anthropic/.*
