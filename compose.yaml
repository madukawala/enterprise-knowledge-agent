# The full local stack. Start it with `make up` (or `docker compose up -d --build --wait`).
#
# Services in this file today: api, postgres, redis, keycloak, and the
# optional prometheus + grafana (profile "observability") and the Pinecone
# emulator used by tests (profile "pinecone-local"). The UI, MCP server
# and Python sandbox are added by their own feature branches.
#
# Layout (ADR-0009):
#   frontend network  - the services you open in a browser. Ports are published
#                       on 127.0.0.1 only, so nothing is reachable from the LAN.
#   backend network   - internal: no published ports and no internet access.
#                       Postgres and Redis live only here.
#
# Every service has a health check, and services wait for the ones they need
# to be healthy before starting.
#
# Secrets come from .env (copy .env.example). Each service gets only the
# variables it needs, never the whole file.

name: enterprise-knowledge-agent

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

services:
  # ---------------------------------------------------------------
  # Application
  # ---------------------------------------------------------------
  api:
    <<: *hardening
    build:
      context: .
      target: api
    image: enterprise-knowledge-agent/api:local
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: json
      POSTGRES_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    networks: [frontend, backend]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # The API writes nothing to disk, so the file system is read-only and
    # every Linux capability is dropped.
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=4)"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512m

  # ---------------------------------------------------------------
  # Data stores (backend network only)
  # ---------------------------------------------------------------
  postgres:
    <<: *hardening
    image: postgres:17.12-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Read by the init script that creates Keycloak's own database and user.
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512m

  redis:
    <<: *hardening
    image: redis:8.10.3-alpine
    # Used for rate-limit counters only, so nothing is saved to disk.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      - --save
      - ""
      - --appendonly
      - "no"
    environment:
      # redis-cli reads the password from here, so it is not on the command line.
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256m

  # ---------------------------------------------------------------
  # Login (Keycloak)
  # ---------------------------------------------------------------
  keycloak:
    <<: *hardening
    image: quay.io/keycloak/keycloak:26.8.2
    # start-dev is fine for a laptop: plain HTTP and no production hostname
    # checks. The realm (roles, demo users, clients) is imported on first start.
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HEALTH_ENABLED: "true"
      # Tokens always name http://localhost:8080 as the issuer, even when the
      # API fetches signing keys over the Docker network at http://keycloak:8080.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes:
      - ./infra/keycloak/realm-helix.json:/opt/keycloak/data/import/realm-helix.json:ro
    ports:
      - "127.0.0.1:8080:8080"
    networks: [frontend, backend]
    depends_on:
      postgres:
        condition: service_healthy
    # The image has no curl or wget, so bash opens the connection itself and
    # reads the health endpoint on the management port (9000).
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 1g

  # ---------------------------------------------------------------
  # Optional monitoring: docker compose --profile observability up -d
  # ---------------------------------------------------------------
  prometheus:
    <<: *hardening
    image: prom/prometheus:v3.16.0
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks: [frontend, backend]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m

  grafana:
    <<: *hardening
    image: grafana/grafana:13.2.6
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    networks: [frontend]
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m

  # ---------------------------------------------------------------
  # Optional, for tests only: Pinecone's emulator.
  # Started by `make test-pinecone-local`; never used by the app itself.
  # It keeps everything in memory, so it has no volume and no API key.
  # ---------------------------------------------------------------
  pinecone-local:
    <<: *hardening
    image: ghcr.io/pinecone-io/pinecone-local:v0.7.0
    profiles: [pinecone-local]
    environment:
      PORT: "5080"
      PINECONE_HOST: localhost
    # 5080 is the control plane (create and describe indexes). Each index
    # gets the next free port, starting at 5081.
    ports:
      - "127.0.0.1:5080-5090:5080-5090"
    networks: [frontend]
    deploy:
      resources:
        limits:
          memory: 512m

networks:
  frontend: {}
  backend:
    internal: true

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
