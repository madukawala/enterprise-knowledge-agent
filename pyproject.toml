[project]
name = "enterprise-knowledge-agent"
version = "0.1.0"
description = "Conversational assistant that answers questions from internal enterprise documents, with citations, role-based access and agent activity tracking."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
# Runtime dependencies. Each feature branch adds the libraries it needs
# (LangGraph, Pinecone and so on) when it is built.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "httpx>=0.27",
    # Postgres and Redis clients. Used by the readiness checks for now,
    # and later by memory (Postgres) and rate limiting (Redis).
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    # Request metrics on /metrics, scraped by Prometheus
    "prometheus-fastapi-instrumentator>=7.0",
    # Vector database client. Also calls Pinecone's hosted embedding model,
    # so no embedding model runs on this machine (ADR-0004).
    "pinecone>=10.3",
    # Reads the front matter (title, department, access level...) of the
    # sample documents during ingestion
    "pyyaml>=6.0",
    # The agent graph (ADR-0006) and the chat model interface it uses
    "langgraph>=1.2.24",
    "langchain-core>=1.8.4",
    # Language models: Claude first, Gemini as the backup (ADR-0017).
    "langchain-anthropic>=1.7.12",
    "langchain-google-genai>=4.5.2",
    # The Anthropic client reads compressed replies through brotlicffi.
    # Older versions fail on every non-streamed call with a misleading
    # "connection error", so the fixed version is pinned here.
    "brotlicffi>=1.2",
    # Traces of every agent run, model call and search
    "langsmith>=0.15.1",
    # Checks the Keycloak login tokens (signature, issuer, audience, expiry).
    # The tests use it too, to sign their own tokens.
    "pyjwt[crypto]>=2.10",
    "langgraph-checkpoint-postgres>=2.0",
    "mcp>=1.20",
]

[dependency-groups]
dev = [
    # Testing
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "hypothesis>=6.115",
    "respx>=0.21",
    # Code quality
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
    "pre-commit>=4.0",
    # Security checks
    "bandit[toml]>=1.8",
    "pip-audit>=2.7",
    # Type hints for PyYAML, used by mypy
    "types-pyyaml>=6.0",
    "fakeredis[lua]>=2.26",
    "playwright>=1.50",
]
# The chat UI's own libraries. The UI image installs only this group
# (see the Dockerfile), so it carries no backend libraries at all.
ui = [
    "httpx>=0.27",
    "streamlit>=1.67.0",
]

[tool.uv]
# `uv sync` and `uv run` install the test tools and the UI libraries too.
default-groups = ["dev", "ui"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

# One Python project with several top-level packages (see ADR-0009).
# The sandbox is not listed here on purpose: it has its own small
# requirements file and is built into its own image.
[tool.hatch.build.targets.wheel]
packages = ["api", "core", "security", "rag", "ingestion", "agents", "ui", "mcp_server"]

# ---------------------------------------------------------------
# Ruff: linting and formatting
# ---------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
# Code samples inside the Markdown docs are written for reading, not run.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "N",        # naming
    "UP",       # newer Python syntax
    "B",        # likely bugs
    "S",        # security (bandit rules)
    "SIM",      # simpler code
    "C4",       # comprehensions
    "RET",      # return statements
    "PT",       # pytest style
    "ASYNC",    # async pitfalls
    "RUF",      # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest works; tests use made-up passwords and tokens on purpose
"tests/**" = ["S101", "S105", "S106"]
# The end-to-end tests drive Docker with fixed commands.
"tests/e2e/**" = ["S101", "S105", "S106", "S603", "S607"]
# The injection rules are regular expressions; each reads best on one line.
"security/guardrails/injection.py" = ["E501"]

# ---------------------------------------------------------------
# mypy: strict type checks on the application packages
# ---------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["api", "core", "security", "rag", "ingestion", "agents", "evals", "ui", "sandbox", "mcp_server"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------
# Import boundaries (checked in CI with `lint-imports`)
# ---------------------------------------------------------------
[tool.importlinter]
root_packages = ["api", "core", "security", "rag", "ingestion", "agents", "evals", "ui", "sandbox", "mcp_server"]

[[tool.importlinter.contracts]]
name = "The UI talks to the API over HTTP only and never imports backend code"
type = "forbidden"
source_modules = ["ui"]
forbidden_modules = ["api", "core", "security", "rag", "ingestion", "agents", "evals"]

[[tool.importlinter.contracts]]
name = "The sandbox is built on its own and imports nothing from the project"
type = "forbidden"
source_modules = ["sandbox"]
forbidden_modules = ["api", "core", "security", "rag", "ingestion", "agents", "evals", "ui"]

[[tool.importlinter.contracts]]
name = "The app reaches the sandbox over HTTP only, never by importing it"
type = "forbidden"
source_modules = ["api", "core", "security", "rag", "ingestion", "agents", "evals", "ui", "mcp_server"]
forbidden_modules = ["sandbox"]

[[tool.importlinter.contracts]]
name = "The MCP server holds its own data and imports nothing but core"
type = "forbidden"
source_modules = ["mcp_server"]
forbidden_modules = ["api", "security", "rag", "ingestion", "agents", "evals", "ui", "sandbox"]

[[tool.importlinter.contracts]]
name = "Core is the bottom layer and does not depend on other packages"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = ["api", "security", "rag", "ingestion", "agents", "evals", "ui", "mcp_server"]

[[tool.importlinter.contracts]]
name = "Ingestion is an offline job: the running services never import it"
type = "forbidden"
source_modules = ["api", "rag", "security", "agents"]
forbidden_modules = ["ingestion"]

[[tool.importlinter.contracts]]
name = "Evaluations are run by hand: nothing else imports them"
type = "forbidden"
source_modules = ["api", "rag", "security", "ingestion", "agents"]
forbidden_modules = ["evals"]

[[tool.importlinter.contracts]]
name = "Search and security are lower layers: they never import the agents"
type = "forbidden"
source_modules = ["rag", "security"]
forbidden_modules = ["agents"]

# ---------------------------------------------------------------
# pytest and coverage
# ---------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
# Tests that need real cloud services or the running stack are left out
# by default. Run them on purpose with `-m live`, `-m eval` or `-m e2e`.
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not live and not eval and not e2e"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: fast tests with no outside services",
    "integration: tests against the API, databases or other services",
    "graph: full LangGraph runs with fake language models",
    "security: tests that show an attack being blocked",
    "resilience: tests that inject failures into dependencies",
    "eval: answer and retrieval quality evaluations",
    "live: tests that call real cloud services and use API quota",
    "e2e: browser tests against the running Docker Compose stack",
]

[tool.coverage.run]
branch = true
# Every application package. The Streamlit page (ui/app.py) is covered
# by tests that run it headless with Streamlit's AppTest.
source = ["api", "core", "security", "rag", "ingestion", "agents", "evals", "ui", "sandbox", "mcp_server"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# ---------------------------------------------------------------
# Bandit: security lint
# ---------------------------------------------------------------
[tool.bandit]
exclude_dirs = ["tests", ".venv"]
